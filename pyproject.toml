[project]
name = "json-to-garmin"
version = "0.1.0"
description = "Generic JSON-defined workouts → Garmin Connect"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "garminconnect>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "json_to_garmin", from = "src" }]
